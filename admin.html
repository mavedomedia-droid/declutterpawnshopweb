<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DPS Admin</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0E1320">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/js/dps-config.js"></script>
<style>
:root{
  --green:#00C853;--green-dark:#00A843;--green-deep:#009933;
  --ink:#0E1320;--ink-2:#161C2B;--ink-3:#1E2536;--ink-4:#2A3248;
  --off-white:#F5F7F8;--white:#FFFFFF;
  --stone:#A7B0AA;--stone-light:#C6CFC9;--stone-dark:#5B635D;
  --mint:#C8F0D8;--mint-soft:#E9F5EE;--tint-soft:#F2F7F4;--tint-edge:#DCE7E0;
  --border:#E1E5E4;--border-ink:#D6DCE0;--border-dark:#242C3E;
  --amber:#B45309;--amber-soft:#FFFBEB;--amber-edge:#FDE68A;
  --red:#DC2626;--red-soft:#FEF2F2;--red-edge:#FECACA;
  --blue:#2563EB;--blue-soft:#EFF6FF;--blue-edge:#BFDBFE;
  --purple:#7C3AED;--purple-soft:#F5F3FF;--purple-edge:#DDD6FE;
  --text-primary:var(--ink);--text-secondary:#4F5860;--text-muted:#8A928C;
  --font-heading:'Manrope',system-ui,sans-serif;
  --font-body:'DM Sans',system-ui,sans-serif;
  --font-mono:'DM Mono',ui-monospace,monospace;
  --r-card:16px;--r-button:12px;--r-pill:999px;
  --shadow-sm:0 1px 2px rgba(14,19,32,.04),0 1px 1px rgba(14,19,32,.03);
  --shadow-md:0 4px 14px rgba(14,19,32,.06),0 1px 3px rgba(14,19,32,.04);
  --shadow-lg:0 24px 60px rgba(14,19,32,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:var(--font-body);background:var(--off-white);color:var(--text-primary);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;}
body.locked{overflow:hidden;}
h1,h2,h3,h4{font-family:var(--font-heading);font-weight:800;letter-spacing:-0.025em;line-height:1.15;color:var(--ink);}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
img{display:block;max-width:100%;height:auto;}
input,textarea,select{font-family:inherit;color:inherit;}

/* ─── Auth gate ──────────────────────────────────── */
.auth{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,rgba(0,200,83,.08) 0%,transparent 55%),var(--ink);padding:24px;}
.auth-card{width:100%;max-width:400px;background:var(--ink-2);border:1px solid var(--border-dark);border-radius:20px;padding:36px 32px;box-shadow:var(--shadow-lg);}
.auth-mark{width:48px;height:48px;border-radius:12px;background:rgba(0,200,83,.12);border:1px solid rgba(0,200,83,.32);color:var(--green);display:flex;align-items:center;justify-content:center;margin-bottom:22px;}
.auth-mark svg{width:22px;height:22px;}
.auth-title{font-family:var(--font-heading);font-weight:800;font-size:22px;letter-spacing:-0.025em;color:#fff;line-height:1.15;}
.auth-sub{font-size:13px;color:var(--stone-light);margin-top:6px;line-height:1.55;}
.auth-lbl{display:block;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--stone);margin:22px 0 8px;}
.auth-input{width:100%;background:var(--ink);border:1.5px solid var(--border-dark);border-radius:10px;padding:13px 14px;font-size:14px;color:#fff;outline:none;font-family:var(--font-mono);letter-spacing:.02em;transition:border-color .15s;}
.auth-input:focus{border-color:var(--green);}
.auth-btn{width:100%;margin-top:18px;padding:13px;background:var(--green);color:var(--ink);font-weight:700;font-size:14px;border-radius:10px;box-shadow:0 2px 0 var(--green-dark);transition:background .15s,box-shadow .15s,transform .1s;}
.auth-btn:hover:not(:disabled){background:var(--green-dark);box-shadow:0 4px 0 var(--green-deep);transform:translateY(-1px);}
.auth-btn:active:not(:disabled){transform:translateY(0);box-shadow:0 1px 0 var(--green-deep);}
.auth-btn:disabled{opacity:.55;cursor:not-allowed;}
.auth-err{font-size:12.5px;color:#F87171;margin-top:12px;line-height:1.55;display:none;}
.auth-err.show{display:block;}

/* ─── Shell ──────────────────────────────────────── */
.shell{display:none;}
.shell.on{display:block;}

/* ─── Nav ────────────────────────────────────────── */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(14,19,32,.94);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(255,255,255,.06);}
.nav-inner{max-width:1400px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:24px;height:64px;}
.nav-brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.nav-mark{width:32px;height:32px;border-radius:9px;background:rgba(0,200,83,.12);border:1px solid rgba(0,200,83,.32);color:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:16px;height:16px;}
.nav-title{font-family:var(--font-heading);font-weight:800;font-size:14.5px;letter-spacing:-0.02em;color:#fff;line-height:1;}
.nav-sub{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--stone);margin-top:3px;}
.nav-tabs{display:flex;gap:2px;margin-left:8px;overflow-x:auto;scrollbar-width:none;}
.nav-tabs::-webkit-scrollbar{display:none;}
.tab{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--stone-light);white-space:nowrap;transition:background .15s,color .15s;}
.tab:hover{background:rgba(255,255,255,.05);color:#fff;}
.tab.active{background:rgba(255,255,255,.08);color:#fff;}
.tab-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:999px;background:var(--amber);color:#1a1300;font-family:var(--font-mono);font-size:10px;font-weight:600;line-height:1;vertical-align:middle;}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:6px;}
.nav-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--stone);transition:background .15s,color .15s;}
.nav-icon:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-icon svg{width:15px;height:15px;}
@media (max-width:1000px){.nav-sub{display:none;}}
@media (max-width:900px){.nav-tabs{margin-left:4px;}.tab{padding:7px 11px;font-size:12px;}}

/* ─── Main ───────────────────────────────────────── */
main{max-width:1400px;margin:0 auto;padding:88px 24px 60px;}
@media (max-width:720px){main{padding:80px 14px 40px;}}

/* ─── Page head ──────────────────────────────────── */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:28px;}
.head-left{min-width:0;}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--green-dark);}
.eyebrow::before{content:'';width:22px;height:1.5px;background:var(--green);}
.head h1{font-size:clamp(26px,3.4vw,36px);letter-spacing:-0.03em;margin-top:10px;line-height:1.05;}
.head-sub{font-size:13.5px;color:var(--text-muted);margin-top:6px;font-family:var(--font-mono);letter-spacing:.02em;}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;}

/* ─── Buttons ────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:var(--font-body);font-weight:700;font-size:13px;padding:10px 16px;border-radius:10px;transition:background .15s,color .15s,border-color .15s,transform .1s,box-shadow .15s;white-space:nowrap;letter-spacing:-0.005em;text-decoration:none;border:none;cursor:pointer;}
.btn svg{flex-shrink:0;}
.btn-primary{background:var(--green);color:var(--ink);box-shadow:0 2px 0 var(--green-dark);}
.btn-primary:hover{background:var(--green-dark);transform:translateY(-1px);box-shadow:0 4px 0 var(--green-deep);}
.btn-primary:active{transform:translateY(0);box-shadow:0 1px 0 var(--green-deep);}
.btn-primary:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:0 2px 0 var(--green-dark);}
.btn-ink{background:var(--ink);color:#fff;}
.btn-ink:hover{background:var(--ink-2);}
.btn-ghost{background:var(--white);color:var(--ink);border:1.5px solid var(--border);}
.btn-ghost:hover{border-color:var(--ink);}
.btn-danger{background:var(--white);color:var(--red);border:1.5px solid var(--red-edge);}
.btn-danger:hover{background:var(--red-soft);border-color:var(--red);}
.btn-danger-solid{background:var(--red);color:#fff;box-shadow:0 2px 0 #991B1B;}
.btn-danger-solid:hover{background:#B91C1C;transform:translateY(-1px);box-shadow:0 4px 0 #7F1D1D;}
.btn-warn{background:var(--amber-soft);color:var(--amber);border:1.5px solid var(--amber-edge);}
.btn-warn:hover{background:#FEF3C7;border-color:var(--amber);}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:9px;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

/* ═══ NEXT ACTION — HERO ═══════════════════════════ */
.hero-action{background:var(--ink);color:#fff;border-radius:20px;padding:28px 30px;margin-bottom:24px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg);}
.hero-action::before{content:'';position:absolute;top:-40%;right:-8%;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(0,200,83,.14) 0%,rgba(0,200,83,0) 65%);pointer-events:none;}
.hero-action::after{content:'';position:absolute;bottom:-50%;left:-5%;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(0,200,83,.05) 0%,rgba(0,200,83,0) 65%);pointer-events:none;}
.hero-inner{position:relative;z-index:1;}
.hero-head{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px;}
.hero-head-left{display:flex;align-items:center;gap:14px;min-width:0;}
.hero-pulse{width:38px;height:38px;border-radius:50%;background:rgba(0,200,83,.14);border:1.5px solid rgba(0,200,83,.4);color:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;}
.hero-pulse::before{content:'';position:absolute;inset:-4px;border-radius:50%;border:1.5px solid rgba(0,200,83,.2);animation:heroPulse 2.4s ease-in-out infinite;}
@keyframes heroPulse{0%,100%{transform:scale(1);opacity:.7;}50%{transform:scale(1.15);opacity:0;}}
.hero-pulse svg{width:18px;height:18px;}
.hero-eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--green);margin-bottom:5px;}
.hero-title{font-family:var(--font-heading);font-weight:800;font-size:clamp(20px,2.6vw,26px);letter-spacing:-0.028em;color:#fff;line-height:1.15;}
.hero-title .n{color:var(--green);}
.hero-clear{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;background:rgba(0,200,83,.12);border:1px solid rgba(0,200,83,.32);color:var(--green);font-size:12.5px;font-weight:700;letter-spacing:-0.005em;transition:background .15s,border-color .15s;}
.hero-clear:hover{background:rgba(0,200,83,.2);border-color:rgba(0,200,83,.55);}
.action-grid{display:grid;grid-template-columns:1fr;gap:10px;}
@media (min-width:760px){.action-grid{grid-template-columns:1fr 1fr;}}
@media (min-width:1180px){.action-grid{grid-template-columns:repeat(4,1fr);}}
.action-tile{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:background .15s,border-color .15s,transform .15s;position:relative;overflow:hidden;text-align:left;font:inherit;color:inherit;}
.action-tile:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);transform:translateY(-2px);}
.action-tile.amber{border-color:rgba(245,158,11,.28);}
.action-tile.amber:hover{border-color:rgba(245,158,11,.55);background:rgba(245,158,11,.08);}
.action-tile.red{border-color:rgba(220,38,38,.32);}
.action-tile.red:hover{border-color:rgba(220,38,38,.6);background:rgba(220,38,38,.08);}
.action-tile.blue{border-color:rgba(59,130,246,.28);}
.action-tile.blue:hover{border-color:rgba(59,130,246,.55);background:rgba(59,130,246,.08);}
.action-tile.green{border-color:rgba(0,200,83,.28);}
.action-tile.green:hover{border-color:rgba(0,200,83,.55);background:rgba(0,200,83,.08);}
.tile-top{display:flex;align-items:center;gap:12px;}
.tile-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tile-icon svg{width:18px;height:18px;}
.tile-icon.amber{background:rgba(245,158,11,.14);color:#F59E0B;border:1px solid rgba(245,158,11,.32);}
.tile-icon.red{background:rgba(220,38,38,.14);color:#F87171;border:1px solid rgba(220,38,38,.32);}
.tile-icon.blue{background:rgba(59,130,246,.14);color:#93C5FD;border:1px solid rgba(59,130,246,.32);}
.tile-icon.green{background:rgba(0,200,83,.14);color:var(--green);border:1px solid rgba(0,200,83,.32);}
.tile-num{font-family:var(--font-heading);font-weight:800;font-size:26px;letter-spacing:-0.04em;color:#fff;line-height:1;font-variant-numeric:tabular-nums;}
.tile-body{min-width:0;}
.tile-title{font-family:var(--font-heading);font-weight:700;font-size:13.5px;color:#fff;letter-spacing:-0.01em;line-height:1.3;}
.tile-desc{font-size:11.5px;color:var(--stone-light);margin-top:3px;line-height:1.5;}
.tile-cta{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--green);letter-spacing:-0.005em;margin-top:2px;}
.tile-cta svg{transition:transform .15s;}
.action-tile:hover .tile-cta svg{transform:translateX(3px);}
.hero-empty{display:flex;align-items:center;gap:14px;padding:14px 0 6px;}
.hero-empty-icon{width:44px;height:44px;border-radius:50%;background:rgba(0,200,83,.14);border:1px solid rgba(0,200,83,.32);color:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hero-empty-icon svg{width:20px;height:20px;}
.hero-empty-title{font-family:var(--font-heading);font-weight:800;font-size:15px;color:#fff;letter-spacing:-0.02em;}
.hero-empty-sub{font-size:12.5px;color:var(--stone-light);margin-top:3px;}

/* ═══ KPIs ═════════════════════════════════════════ */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
@media (min-width:900px){.kpis{grid-template-columns:repeat(4,1fr);}}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden;}
.kpi.dark{background:var(--ink);border-color:var(--ink);color:#fff;}
.kpi.dark .kpi-lbl{color:var(--stone);}
.kpi.dark .kpi-val{color:#fff;}
.kpi.dark .kpi-sub{color:var(--stone-light);}
.kpi-lbl{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);}
.kpi-val{font-family:var(--font-heading);font-weight:800;font-size:clamp(22px,2.6vw,28px);letter-spacing:-0.032em;color:var(--ink);line-height:1;margin-top:10px;font-variant-numeric:tabular-nums;}
.kpi-sub{font-size:11.5px;color:var(--text-muted);margin-top:7px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.kpi-delta{display:inline-flex;align-items:center;gap:3px;font-family:var(--font-mono);font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;}
.kpi-delta.up{background:var(--mint-soft);color:var(--green-dark);}
.kpi-delta.down{background:var(--red-soft);color:var(--red);}
.kpi-delta.flat{background:var(--tint-soft);color:var(--text-muted);}

/* ═══ Charts row ══════════════════════════════════ */
.charts{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:24px;}
@media (min-width:900px){.charts{grid-template-columns:1.6fr 1fr 1fr;}}
.card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;min-height:0;}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:4px;}
.card-title{font-family:var(--font-heading);font-weight:800;font-size:14px;letter-spacing:-0.015em;color:var(--ink);}
.card-sub{font-size:11.5px;color:var(--text-muted);margin-bottom:18px;letter-spacing:-0.005em;}
.card-sub strong{color:var(--ink);font-weight:700;}
.card-link{font-size:11.5px;font-weight:700;color:var(--green-dark);display:inline-flex;align-items:center;gap:4px;letter-spacing:-0.005em;cursor:pointer;}
.card-link:hover{color:var(--green-deep);}
.card-link svg{transition:transform .15s;}
.card-link:hover svg{transform:translateX(2px);}

.bars{display:flex;align-items:flex-end;gap:8px;height:140px;margin-top:auto;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;}
.bar-track{flex:1;width:100%;display:flex;align-items:flex-end;background:var(--off-white);border-radius:7px;overflow:hidden;}
.bar-fill{width:100%;background:linear-gradient(180deg,var(--green) 0%,var(--green-dark) 100%);border-radius:7px 7px 0 0;min-height:4px;transition:height .55s cubic-bezier(.2,.8,.3,1);}
.bar-fill.today{background:linear-gradient(180deg,var(--green) 0%,var(--green-deep) 100%);box-shadow:0 -4px 16px rgba(0,200,83,.28);}
.bar-fill.zero{background:var(--border);}
.bar-lbl{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);letter-spacing:.02em;}
.bar-val{font-family:var(--font-mono);font-size:10.5px;font-weight:600;color:var(--ink);}

.donut-wrap{display:flex;align-items:center;gap:20px;margin-top:auto;padding-top:4px;}
.donut{width:120px;height:120px;border-radius:50%;position:relative;flex-shrink:0;background:conic-gradient(var(--green) 0deg var(--deg-a,0deg),var(--ink-3) var(--deg-a,0deg) 360deg);transition:background .5s;}
.donut::after{content:'';position:absolute;inset:18px;border-radius:50%;background:var(--white);}
.donut-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:1;}
.donut-num{font-family:var(--font-heading);font-weight:800;font-size:26px;letter-spacing:-0.04em;color:var(--ink);line-height:1;}
.donut-cap{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin-top:4px;}
.donut-legend{display:flex;flex-direction:column;gap:10px;font-size:12.5px;flex:1;min-width:0;}
.donut-row{display:flex;align-items:center;gap:9px;color:var(--text-secondary);}
.donut-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
.donut-dot.g{background:var(--green);}
.donut-dot.s{background:var(--ink-3);}
.donut-lbl{font-weight:600;color:var(--text-primary);}
.donut-val{margin-left:auto;font-family:var(--font-mono);font-weight:600;color:var(--ink);font-size:12px;}
.donut-pct{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);}

.top-list{display:flex;flex-direction:column;gap:0;margin-top:auto;}
.top-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.top-item:last-child{border-bottom:none;padding-bottom:0;}
.top-rank{font-family:var(--font-mono);font-size:10.5px;font-weight:600;color:var(--text-muted);width:16px;flex-shrink:0;}
.top-rank.r1{color:var(--green-dark);}
.top-thumb{width:38px;height:38px;border-radius:9px;object-fit:cover;background:var(--off-white);border:1px solid var(--border);flex-shrink:0;}
.top-thumb-fb{width:38px;height:38px;border-radius:9px;background:var(--off-white);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--stone);flex-shrink:0;}
.top-body{flex:1;min-width:0;}
.top-name{font-family:var(--font-heading);font-weight:700;font-size:12.5px;color:var(--ink);letter-spacing:-0.005em;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top-id{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:2px;letter-spacing:.03em;}
.top-views{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--green-dark);white-space:nowrap;flex-shrink:0;}
.top-views svg{width:11px;height:11px;}

/* ═══ Activity ════════════════════════════════════ */
.activity-card{background:var(--white);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:24px;}
.activity-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 22px;border-bottom:1px solid var(--border);}
.activity-list{display:flex;flex-direction:column;}
.activity-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--border);transition:background .15s;}
.activity-row:last-child{border-bottom:none;}
.activity-row:hover{background:var(--off-white);}
.act-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.act-icon.listed{background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue-edge);}
.act-icon.sold{background:var(--mint-soft);color:var(--green-dark);border:1px solid rgba(0,200,83,.28);}
.act-icon.partner{background:var(--purple-soft);color:var(--purple);border:1px solid var(--purple-edge);}
.act-icon.offer-pending{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-edge);}
.act-icon.offer-countered{background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue-edge);}
.act-icon.offer-accepted{background:var(--mint-soft);color:var(--green-dark);border:1px solid rgba(0,200,83,.28);}
.act-icon.offer-declined,
.act-icon.offer-expired,
.act-icon.offer-withdrawn{background:var(--off-white);color:var(--text-muted);border:1px solid var(--border);}
.act-body{min-width:0;}
.act-text{font-size:13px;color:var(--ink);font-weight:500;letter-spacing:-0.005em;line-height:1.4;}
.act-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.act-when{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);white-space:nowrap;flex-shrink:0;letter-spacing:.02em;}

/* ═══ Filters ═════════════════════════════════════ */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
.search-box{position:relative;flex:1;min-width:220px;max-width:380px;display:flex;align-items:center;}
.search-box svg{position:absolute;left:13px;color:var(--text-muted);pointer-events:none;width:14px;height:14px;}
.search-box input{width:100%;padding:11px 14px 11px 38px;background:var(--white);border:1.5px solid var(--border);border-radius:10px;font-size:13.5px;color:var(--ink);outline:none;transition:border-color .15s;}
.search-box input:focus{border-color:var(--ink);}
.search-box input::placeholder{color:var(--text-muted);}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:8px 14px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;background:var(--white);border:1.5px solid var(--border);color:var(--text-secondary);transition:all .15s;white-space:nowrap;}
.chip:hover{border-color:var(--stone);color:var(--ink);}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

/* ═══ Tables ══════════════════════════════════════ */
.table-card{background:var(--white);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
.table-wrap{overflow-x:auto;}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;}
.tbl thead th{text-align:left;padding:13px 16px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);background:var(--off-white);border-bottom:1px solid var(--border);white-space:nowrap;}
.tbl tbody td{padding:14px 16px;border-bottom:1px solid var(--border);color:var(--text-secondary);vertical-align:middle;}
.tbl tbody tr:last-child td{border-bottom:none;}
.tbl tbody tr:hover{background:var(--off-white);}
.tbl tbody tr.clickable{cursor:pointer;}
.tbl .mono{font-family:var(--font-mono);font-size:12px;}
.tbl .num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.tbl .strong{color:var(--ink);font-weight:600;}
.tbl .muted{color:var(--text-muted);}
.tbl .cb-cell{width:36px;padding:12px 6px 12px 16px;}
.tbl .cb-cell input{width:16px;height:16px;accent-color:var(--green);cursor:pointer;}

.cell-item{display:flex;align-items:center;gap:12px;}
.cell-thumb{width:40px;height:40px;border-radius:9px;object-fit:cover;background:var(--off-white);border:1px solid var(--border);flex-shrink:0;}
.cell-thumb-fb{width:40px;height:40px;border-radius:9px;background:var(--off-white);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--stone);font-size:16px;flex-shrink:0;}
.cell-item-body{min-width:0;}
.cell-item-name{color:var(--ink);font-weight:600;font-size:13.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px;}
.cell-item-id{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:2px;letter-spacing:.03em;}

/* ═══ Badges ══════════════════════════════════════ */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;line-height:1.4;white-space:nowrap;}
.badge-green{background:var(--mint-soft);color:var(--green-dark);border:1px solid rgba(0,200,83,.28);}
.badge-amber{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-edge);}
.badge-red{background:var(--red-soft);color:var(--red);border:1px solid var(--red-edge);}
.badge-blue{background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue-edge);}
.badge-purple{background:var(--purple-soft);color:var(--purple);border:1px solid var(--purple-edge);}
.badge-muted{background:var(--off-white);color:var(--text-secondary);border:1px solid var(--border);}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

/* ═══ Partner cards ═══════════════════════════════ */
.partner-grid{display:grid;grid-template-columns:1fr;gap:12px;}
@media (min-width:720px){.partner-grid{grid-template-columns:repeat(2,1fr);}}
@media (min-width:1100px){.partner-grid{grid-template-columns:repeat(3,1fr);}}
.partner-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:20px;cursor:pointer;transition:border-color .15s,transform .12s,box-shadow .15s;position:relative;}
.partner-card:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:var(--shadow-md);}
.partner-card.attention{border-color:var(--amber-edge);background:linear-gradient(180deg,rgba(245,158,11,.04) 0%,transparent 60%),var(--white);}
.partner-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;}
.partner-avatar{width:48px;height:48px;border-radius:12px;flex-shrink:0;background:var(--off-white);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--text-muted);font-family:var(--font-heading);font-weight:800;font-size:16px;}
.partner-avatar img{width:100%;height:100%;object-fit:cover;}
.partner-meta{min-width:0;flex:1;}
.partner-name{font-family:var(--font-heading);font-weight:700;font-size:15px;letter-spacing:-0.012em;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.partner-handle{font-family:var(--font-mono);font-size:11.5px;color:var(--green-dark);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.partner-loc{font-size:11px;color:var(--text-muted);margin-top:4px;}
.partner-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--border);padding-top:14px;}
.partner-stat{text-align:center;padding:0 4px;}
.partner-stat-lbl{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);}
.partner-stat-val{font-family:var(--font-heading);font-weight:800;font-size:15px;letter-spacing:-0.02em;margin-top:4px;color:var(--ink);font-variant-numeric:tabular-nums;}
.partner-stat-val.green{color:var(--green-dark);}
.partner-attention{position:absolute;top:16px;right:16px;}

/* ═══ Detail header ═══════════════════════════════ */
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:16px;cursor:pointer;transition:color .15s;}
.back-link:hover{color:var(--ink);}
.detail-header{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:22px;}
.detail-logo{width:64px;height:64px;border-radius:14px;flex-shrink:0;background:var(--white);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--text-muted);font-family:var(--font-heading);font-weight:800;font-size:22px;}
.detail-logo img{width:100%;height:100%;object-fit:cover;}
.detail-meta{flex:1;min-width:0;}
.detail-name{font-family:var(--font-heading);font-weight:800;font-size:26px;letter-spacing:-0.032em;line-height:1.15;}
.detail-handle{font-family:var(--font-mono);font-size:13px;color:var(--green-dark);margin-top:6px;}
.detail-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px;}
@media (min-width:600px){.stats-grid{grid-template-columns:repeat(3,1fr);}}
@media (min-width:1000px){.stats-grid{grid-template-columns:repeat(6,1fr);}}
.stat-cell{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px;}
.stat-cell-lbl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);}
.stat-cell-val{font-family:var(--font-heading);font-weight:800;font-size:20px;letter-spacing:-0.028em;margin-top:8px;line-height:1;font-variant-numeric:tabular-nums;}
.stat-cell-val.green{color:var(--green-dark);}

.detail-grid{display:grid;grid-template-columns:1fr;gap:16px;}
@media (min-width:1000px){.detail-grid{grid-template-columns:2fr 1fr;}}

.kv-list{display:flex;flex-direction:column;}
.kv-row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px;}
.kv-row:last-child{border-bottom:none;}
.kv-k{color:var(--text-muted);flex-shrink:0;}
.kv-v{color:var(--ink);font-weight:600;text-align:right;word-break:break-word;}
.kv-v.mono{font-family:var(--font-mono);font-size:12.5px;font-weight:500;}

/* ═══ Modal ═══════════════════════════════════════ */
.modal-bg{position:fixed;inset:0;z-index:500;background:rgba(14,19,32,.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-bg.open{opacity:1;pointer-events:all;}
.modal{background:var(--white);border:1px solid var(--border);border-radius:18px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);transform:scale(.97);transition:transform .2s;}
.modal-bg.open .modal{transform:scale(1);}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:14px;}
.modal-title{font-family:var(--font-heading);font-weight:800;font-size:16px;letter-spacing:-0.02em;color:var(--ink);}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--off-white);color:var(--ink);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.modal-close:hover{background:var(--border);}
.modal-body{padding:20px 24px;}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:var(--off-white);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:7px;}
.field input,.field textarea{width:100%;background:var(--off-white);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--ink);outline:none;transition:border-color .15s,background .15s;}
.field input:focus,.field textarea:focus{border-color:var(--ink);background:var(--white);}
.field textarea{resize:vertical;min-height:100px;line-height:1.55;font-family:inherit;}

/* ═══ Toast ═══════════════════════════════════════ */
.toasts{position:fixed;bottom:24px;right:24px;z-index:9000;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:400px;}
.toast{background:var(--ink);border:1px solid var(--border-dark);border-radius:12px;padding:14px 16px;font-size:13.5px;color:#fff;box-shadow:var(--shadow-lg);display:flex;align-items:flex-start;gap:10px;animation:toastIn .22s ease;pointer-events:all;line-height:1.45;}
.toast svg{flex-shrink:0;margin-top:1px;}
.toast.green{border-color:rgba(0,200,83,.4);}
.toast.green svg{color:var(--green);}
.toast.red{border-color:rgba(220,38,38,.4);}
.toast.red svg{color:#F87171;}
.toast.amber{border-color:rgba(245,158,11,.4);}
.toast.amber svg{color:#F59E0B;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@media (max-width:640px){.toasts{left:16px;right:16px;bottom:16px;max-width:none;}}

/* ═══ Bulk bar ════════════════════════════════════ */
.bulk-bar{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:800;background:var(--ink);border:1px solid var(--border-dark);border-radius:14px;padding:14px 18px;align-items:center;gap:12px;box-shadow:var(--shadow-lg);}
.bulk-bar.on{display:flex;}
.bulk-count{font-family:var(--font-mono);font-size:12.5px;color:#fff;white-space:nowrap;}
.bulk-bar .btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.2);}
.bulk-bar .btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,.06);}

/* ═══ Loading / empty ═════════════════════════════ */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:14px;color:var(--text-muted);}
.spinner{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--green);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:60px 24px;color:var(--text-muted);}
.empty svg{color:var(--stone);margin-bottom:16px;}
.empty h3{font-family:var(--font-heading);font-weight:700;font-size:17px;color:var(--ink);margin-bottom:6px;}
.empty p{font-size:13.5px;}

/* ═══ Responsive tweaks ═══════════════════════════ */
@media (max-width:720px){
  .hero-action{padding:20px 18px;border-radius:16px;}
  .action-grid{gap:8px;}
  .action-tile{padding:14px;}
  .tile-icon{width:34px;height:34px;}
  .tile-num{font-size:22px;}
  .kpi{padding:14px 16px;}
  .kpi-val{font-size:22px;}
  .card{padding:16px;}
  .activity-row{padding:12px 16px;gap:10px;}
  .cell-item-name{max-width:180px;}
  .detail-name{font-size:22px;}
}
</style>
</head>
<body>

<!-- ═══ AUTH GATE ═══ -->
<div class="auth" id="auth">
  <div class="auth-card">
    <div class="auth-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
    </div>
    <div class="auth-title">DPS Admin</div>
    <div class="auth-sub">Operations console. Paste your admin key to continue.</div>
    <label class="auth-lbl" for="authKey">Access key</label>
    <input class="auth-input" type="password" id="authKey" placeholder="Paste key" autocomplete="off" spellcheck="false">
    <button class="auth-btn" id="authBtn">Unlock</button>
    <div class="auth-err" id="authErr"></div>
  </div>
</div>

<!-- ═══ SHELL ═══ -->
<div class="shell" id="shell">

  <nav class="nav">
    <div class="nav-inner">
      <div class="nav-brand">
        <div class="nav-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div>
          <div class="nav-title">DPS</div>
          <div class="nav-sub">Admin</div>
        </div>
      </div>
      <nav class="nav-tabs" id="tabs">
        <a class="tab" data-route="today">Today</a>
        <a class="tab" data-route="partners">Partners<span class="tab-badge" id="badgePartners" style="display:none;"></span></a>
        <a class="tab" data-route="items">Items<span class="tab-badge" id="badgeItems" style="display:none;"></span></a>
        <a class="tab" data-route="offers">Offers<span class="tab-badge" id="badgeOffers" style="display:none;"></span></a>
        <a class="tab" data-route="sales">Sales</a>
        <a class="tab" data-route="payouts">Payouts<span class="tab-badge" id="badgePayouts" style="display:none;"></span></a>
        <a class="tab" data-route="dina">Dina</a>
      </nav>
      <div class="nav-right">
        <button class="nav-icon" id="btnRefresh" aria-label="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
        <button class="nav-icon" id="btnLogout" aria-label="Log out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main id="main"></main>

  <div class="modal-bg" id="modalBg">
    <div class="modal" id="modal"></div>
  </div>

  <div class="toasts" id="toasts"></div>

  <div class="bulk-bar" id="bulkBar">
    <span class="bulk-count" id="bulkCount">0 selected</span>
    <button class="btn btn-primary btn-sm" id="bulkApprove">Approve</button>
    <button class="btn btn-danger-solid btn-sm" id="bulkReject">Reject</button>
    <button class="btn btn-ghost btn-sm" id="bulkClear">Clear</button>
  </div>

</div>

<script>
(function(){
"use strict";

// ═══════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════
var GAS = (typeof DPS_MAIN_GAS_URL !== "undefined" && DPS_MAIN_GAS_URL) ? DPS_MAIN_GAS_URL : "";
var KEY_STORE = "dps_admin_key";

if(!GAS){
  document.body.innerHTML = '<div style="padding:60px 24px;text-align:center;font-family:system-ui,sans-serif;color:#0E1320;"><h1 style="font-size:22px;margin-bottom:12px;">Configuration error</h1><p style="color:#8A928C;max-width:480px;margin:0 auto;line-height:1.6;"><code>DPS_MAIN_GAS_URL</code> is missing. Check that <code>/js/dps-config.js</code> loads.</p></div>';
  return;
}

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
var state = {
  key: localStorage.getItem(KEY_STORE) || "",
  route: "today",
  partnerId: null,
  today: null,
  partners: null,
  partnerDetail: null,
  items: null,
  itemsFilter: { status: "", source: "", q: "" },
  itemsSelection: {},
  offers: null, offersFilter: { status: "", q: "" },
  sales: null, salesQ: "",
  payouts: null, payoutsFilter: { status: "", q: "" },
  dinaLog: null, dinaPartnerFilter: "",
  partnersQ: "", partnersFilter: "all",
  refreshing: false
};

// ═══════════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════════
function $(id){ return document.getElementById(id); }
function el(tag, attrs, children){
  var e = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k === "class") e.className = attrs[k];
    else if(k === "html") e.innerHTML = attrs[k];
    else if(k === "style") e.setAttribute("style", attrs[k]);
    else if(k.indexOf("on") === 0) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if(attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) e.setAttribute(k, attrs[k]);
  }
  if(children){
    if(!Array.isArray(children)) children = [children];
    children.forEach(function(c){
      if(c == null) return;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
  }
  return e;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];}); }
function naira(n){ var v=parseInt(String(n==null?"":n).replace(/[^0-9-]/g,""),10)||0; return "₦"+v.toLocaleString("en-NG"); }
function num(v){ return parseInt(String(v==null?"":v).replace(/[^0-9]/g,""),10)||0; }
function initials(s){ if(!s) return "?"; return String(s).trim().split(/\s+/).slice(0,2).map(function(w){return (w[0]||"").toUpperCase();}).join(""); }
function fmtDate(v){
  if(!v) return "-";
  var s=String(v);
  var d=s.indexOf("T")>0?new Date(s):new Date(s.replace(" ","T"));
  if(!d||isNaN(d.getTime())) return s;
  var ms=Date.now()-d.getTime();
  if(ms<60000) return "just now";
  if(ms<3600000) return Math.floor(ms/60000)+"m ago";
  if(ms<86400000) return Math.floor(ms/3600000)+"h ago";
  if(ms<7*86400000) return Math.floor(ms/86400000)+"d ago";
  return d.toLocaleDateString("en-NG",{month:"short",day:"numeric"});
}
function fmtDateFull(v){
  if(!v) return "-";
  var s=String(v);
  var d=s.indexOf("T")>0?new Date(s):new Date(s.replace(" ","T"));
  if(!d||isNaN(d.getTime())) return s;
  return d.toLocaleDateString("en-NG",{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
}
function statusKind(st){
  st=String(st||"").toLowerCase();
  if(st==="active"||st==="live"||st==="settled") return "badge-green";
  if(st==="pending approval"||st==="pending"||st==="pending pickup"||st==="countered"||st==="draft") return "badge-amber";
  if(st==="rejected"||st==="removed"||st==="expired"||st==="unavailable"||st==="withdrawn") return "badge-red";
  if(st==="paid"||st==="sold") return "badge-blue";
  return "badge-muted";
}
function imgFail(img){

  if(!p) return;
  var fb = document.createElement("div");
  fb.className = "cell-thumb-fb";
  fb.textContent = "📦";
  p.replaceChild(fb, img);
}

// API
// ═══════════════════════════════════════════════════════════════
function apiGet(action, extra){
  var q = "?action=" + encodeURIComponent(action) + "&key=" + encodeURIComponent(state.key);
  if(extra) for(var k in extra) if(extra[k] != null && extra[k] !== "") q += "&" + k + "=" + encodeURIComponent(extra[k]);
  return fetch(GAS + q).then(function(r){ return r.text(); }).then(function(text){
    try{ return JSON.parse(text); }
    catch(e){ return { success:false, error:"Invalid JSON: " + text.slice(0,200) }; }
  });
}
function apiPost(action, data){
  var payload = Object.assign({ action: action, key: state.key }, data || {});
  return fetch(GAS, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).then(function(r){ return r.text(); }).then(function(text){
    try{ return JSON.parse(text); }
    catch(e){ return { success:false, error:"Invalid JSON: " + text.slice(0,200) }; }
  });
}

function showAuth(){
  $("auth").style.display = "flex";
  $("shell").classList.remove("on");
  setTimeout(function(){ $("authKey").focus(); }, 100);
}
function showShell(){
  $("auth").style.display = "none";
  $("shell").classList.add("on");
}
function authErr(msg){
  var e = $("authErr");
  e.textContent = msg;
  e.classList.add("show");
}
function validateKey(key){
  state.key = key;
  return apiGet("adminToday").then(function(r){
    if(r && r.success){
      localStorage.setItem(KEY_STORE, key);
      state.today = r;
      showShell();
      route_();
      return true;
    }
    localStorage.removeItem(KEY_STORE); state.key = "";
    if(r && r.error === "Unknown action") authErr("Server doesn't know adminToday. Redeploy the GAS Web App as a new version.");
    else if(r && r.error === "Unauthorized") authErr("Key doesn't match ADMIN_KEY.");
    else authErr((r && r.error) || "Could not verify key.");
    return false;
  }).catch(function(e){
    state.key = ""; localStorage.removeItem(KEY_STORE);
    authErr("Network error: " + (e.message || "unknown"));
    return false;
  });
}
$("authBtn").addEventListener("click", function(){
  var k = $("authKey").value.trim();
  if(!k) return;
  this.textContent = "Checking…"; this.disabled = true; $("authErr").classList.remove("show");
  var self = this;
  validateKey(k).then(function(){ self.textContent = "Unlock"; self.disabled = false; });
});
$("authKey").addEventListener("keydown", function(e){ if(e.key === "Enter") $("authBtn").click(); });
$("btnLogout").addEventListener("click", function(){
  localStorage.removeItem(KEY_STORE);
  state.key = "";
  state.today = state.partners = state.partnerDetail = state.items = state.sales = state.offers = state.payouts = state.dinaLog = null;
  showAuth();
});

function setRoute(route, opts){
  opts = opts || {};
  if(route === "partner" && opts.partnerId){ state.partnerId = opts.partnerId; location.hash = "#/partners/" + opts.partnerId; }
  else if(route === "dina" && opts.partnerId){ location.hash = "#/dina/" + opts.partnerId; }
  else { location.hash = route === "today" ? "#/" : "#/" + route; }
  route_();
}
function route_(){
  var hash = (location.hash || "#/").replace(/^#\/?/, "");
  var parts = hash.split("/");
  var r = parts[0] || "today";
  var pid = parts[1] || null;
  if(r === "partners" && pid){ state.route = "partnerDetail"; state.partnerId = pid; }
  else if(r === "partners"){ state.route = "partners"; }
  else if(r === "items"){ state.route = "items"; }
  else if(r === "offers"){ state.route = "offers"; }
  else if(r === "sales"){ state.route = "sales"; }
  else if(r === "payouts"){ state.route = "payouts"; }
  else if(r === "dina"){ state.route = "dina"; state.dinaPartnerFilter = pid || ""; }
  else { state.route = "today"; }
  if(state.route !== "items") state.itemsSelection = {};
  updateBulkBar();
  renderTabs();
  render();
}
window.addEventListener("hashchange", route_);

function renderTabs(){
  var active = state.route === "partnerDetail" ? "partners" : state.route;
  document.querySelectorAll(".tab").forEach(function(t){
    t.classList.toggle("active", t.getAttribute("data-route") === active);
  });

  if(state.today && state.today.needsAttention){
    var na = state.today.needsAttention;
    var badges = {
      badgeItems: na.pendingApproval || 0,
      badgePartners: na.partnerIssues || 0,
      badgeOffers: na.offersPending || 0,
      badgePayouts: na.pickupFollowUps || 0
    };
    for(var id in badges){
      var b = $(id);
      if(!b) continue;
      if(badges[id] > 0){ b.textContent = badges[id]; b.style.display = "inline-flex"; }
      else b.style.display = "none";
    }
  }
}
document.querySelectorAll(".tab").forEach(function(t){
  t.addEventListener("click", function(e){ e.preventDefault(); setRoute(t.getAttribute("data-route")); });
});

function render(){
  var main = $("main"); main.innerHTML = "";
  if(state.route === "today")         return renderToday(main);
  if(state.route === "partners")      return renderPartners(main);
  if(state.route === "partnerDetail") return renderPartnerDetail(main, state.partnerId);
  if(state.route === "items")         return renderItems(main);
  if(state.route === "offers")        return renderOffers(main);
  if(state.route === "sales")         return renderSales(main);
  if(state.route === "payouts")       return renderPayouts(main);
  if(state.route === "dina")          return renderDina(main);
}

function buildActionHero(r){
  var na = r.needsAttention || {};
  // Normalise into a list of action tiles
  var tiles = [];
  if(na.pendingApproval > 0) tiles.push({ kind:"amber", title:"Pending approvals", desc:"Listings waiting for review", count:na.pendingApproval, cta:"Review listings", route:"items" });
  if(na.partnerIssues > 0)   tiles.push({ kind:"red",   title:"Partner issues",     desc:"Sync errors, stale, or unverified", count:na.partnerIssues, cta:"Check partners", route:"partners" });
  if(na.offersPending > 0)   tiles.push({ kind:"amber", title:"Offers pending",     desc:"Waiting on sellers to respond", count:na.offersPending, cta:"Open offers", route:"offers" });
  if(na.pickupFollowUps > 0) tiles.push({ kind:"blue",  title:"Pickup follow-ups",  desc:"Buyers who haven't collected", count:na.pickupFollowUps, cta:"See payouts", route:"payouts" });

  var hero = el("section", { class:"hero-action" });
  var inner = el("div", { class:"hero-inner" });

  if(!tiles.length){
    inner.innerHTML =
      '<div class="hero-head"><div class="hero-head-left"><div class="hero-pulse">'+ICON.check+'</div><div><div class="hero-eyebrow">Next action</div><div class="hero-title">You\'re all clear.</div></div></div></div>'+
      '<div class="hero-empty"><div class="hero-empty-icon">'+ICON.check+'</div><div><div class="hero-empty-title">Nothing needs you right now</div><div class="hero-empty-sub">New listings and offers will surface here the moment they land.</div></div></div>';
    hero.appendChild(inner);
    return hero;
  }

  var total = tiles.reduce(function(s,t){ return s + t.count; }, 0);
  var iconMap = { amber:"clock", red:"alert", blue:"flag", green:"check" };
  var tilesHTML = tiles.map(function(t){
    return '<button class="action-tile '+t.kind+'" data-route="'+esc(t.route)+'">'+
      '<div class="tile-top"><div class="tile-icon '+t.kind+'">'+ICON[iconMap[t.kind]||"check"]+'</div><div class="tile-num">'+t.count+'</div></div>'+
      '<div class="tile-body"><div class="tile-title">'+esc(t.title)+'</div><div class="tile-desc">'+esc(t.desc)+'</div></div>'+
      '<span class="tile-cta">'+esc(t.cta)+'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></span>'+
    '</button>';
  }).join("");

  inner.innerHTML =
    '<div class="hero-head">'+
      '<div class="hero-head-left"><div class="hero-pulse">'+ICON.alert+'</div><div><div class="hero-eyebrow">Next action · '+total+' item'+(total===1?'':'s')+' waiting</div><div class="hero-title">These need you <span class="n">before you do anything else.</span></div></div></div>'+
      '<button class="hero-clear" id="heroClear">Review in order <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>'+
    '</div>'+
    '<div class="action-grid">'+tilesHTML+'</div>';

  // wire
  setTimeout(function(){
    inner.querySelectorAll(".action-tile").forEach(function(t){
      t.addEventListener("click", function(){
        var r = t.getAttribute("data-route");
        if(r) setRoute(r);
      });
    });
    var clear = document.getElementById("heroClear");
    if(clear) clear.addEventListener("click", function(){
      if(tiles[0]) setRoute(tiles[0].route);
    });
  }, 0);

  hero.appendChild(inner);
  return hero;
}

function buildPartnersScreen(r){
  var wrap = el("div");
  var all = r.partners || [];
  var active = all.filter(function(p){ return String(p.status).toLowerCase() === "active"; }).length;
  var pending = all.filter(function(p){ return String(p.status).toLowerCase() === "pending"; }).length;
  var attention = all.filter(function(p){ return p.needsAttention; }).length;

  wrap.appendChild(el("div", { class:"head" }, [
    el("div", { class:"head-left" }, [
      el("span", { class:"eyebrow", html:"Supply" }),
      el("h1", { html:"Partners" }),
      el("div", { class:"head-sub", html:all.length + " total · " + active + " active · " + pending + " pending · " + attention + " need attention" })
    ])
  ]));

  var filters = el("div", { class:"filters" });
  var sw = el("div", { class:"search-box" });
  sw.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
  var si = el("input", { type:"text", placeholder:"Search partners, handles, emails…", value:state.partnersQ || "" });
  si.addEventListener("input", function(e){ state.partnersQ = e.target.value; rerenderList(); });
  sw.appendChild(si);
  filters.appendChild(sw);

  var chips = el("div", { class:"chips" });
  [["all","All"],["attention","Needs attention"],["active","Active"],["pending","Pending"],["suspended","Suspended"]].forEach(function(pair){
    var c = el("button", { class:"chip" + (state.partnersFilter === pair[0] ? " active" : ""), html:pair[1] });
    c.addEventListener("click", function(){
      state.partnersFilter = pair[0];
      chips.querySelectorAll(".chip").forEach(function(x){ x.classList.remove("active"); });
      c.classList.add("active");
      rerenderList();
    });
    chips.appendChild(c);
  });
  filters.appendChild(chips);
  wrap.appendChild(filters);

  var grid = el("div", { class:"partner-grid" });
  wrap.appendChild(grid);

  function rerenderList(){
    var q = (state.partnersQ || "").toLowerCase().trim();
    var f = state.partnersFilter;
    var list = all.filter(function(p){
      if(f === "attention" && !p.needsAttention) return false;
      if(f === "active" && String(p.status).toLowerCase() !== "active") return false;
      if(f === "pending" && String(p.status).toLowerCase() !== "pending") return false;
      if(f === "suspended" && String(p.status).toLowerCase() !== "suspended") return false;
      if(q){
        var blob = (p.businessName + " " + p.instagram + " " + p.email + " " + p.partnerId + " " + p.category + " " + p.location).toLowerCase();
        if(blob.indexOf(q) < 0) return false;
      }
      return true;
    });
    grid.innerHTML = "";
    if(!list.length){
      grid.appendChild(el("div", { class:"empty", style:"grid-column:1/-1;", html:"<h3>No partners match</h3><p>Try a different filter or search term.</p>" }));
      return;
    }
    list.forEach(function(p){ grid.appendChild(partnerCard(p)); });
  }
  rerenderList();
  return wrap;
}
function partnerCard(p){
  var statusClass = { active:"badge-green", pending:"badge-amber", suspended:"badge-red" }[String(p.status).toLowerCase()] || "badge-muted";
  var handle = p.instagram ? ("@" + String(p.instagram).replace(/^@/, "")) : "no handle";
  var card = el("div", { class:"partner-card" + (p.needsAttention ? " attention" : "") });
  card.addEventListener("click", function(){ setRoute("partner", { partnerId: p.partnerId }); });
  var avatarHTML = p.logoUrl
    ? '<img src="'+esc(p.logoUrl)+'" alt="" onerror="this.parentNode.textContent=\''+esc(initials(p.businessName))+'\'">'
    : esc(initials(p.businessName));
  card.innerHTML =
    '<div class="partner-head">'+
      '<div class="partner-avatar">'+avatarHTML+'</div>'+
      '<div class="partner-meta">'+
        '<div class="partner-name">'+esc(p.businessName||"Unnamed partner")+'</div>'+
        '<div class="partner-handle">'+esc(handle)+'</div>'+
        '<div class="partner-loc">'+esc([p.category, p.location].filter(Boolean).join(" · ")||"—")+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="partner-stats">'+
      '<div class="partner-stat"><div class="partner-stat-lbl">Live</div><div class="partner-stat-val">'+(p.liveItems||0)+'</div></div>'+
      '<div class="partner-stat"><div class="partner-stat-lbl">Sold</div><div class="partner-stat-val">'+(p.sold||0)+'</div></div>'+
      '<div class="partner-stat"><div class="partner-stat-lbl">Earnings</div><div class="partner-stat-val green">'+esc(naira(p.partnerEarnings))+'</div></div>'+
    '</div>';
  card.appendChild(el("div", { class:"partner-attention", html: p.needsAttention
    ? '<span class="badge badge-amber"><span class="badge-dot"></span>'+esc(p.attentionReason||"Attention")+'</span>'
    : '<span class="badge '+statusClass+'">'+esc(p.status||"—")+'</span>'
  }));
  return card;
}

function partnerAction(btn, action, data, successMsg, onSuccess){
  btn.disabled = true;
  var original = btn.textContent;
  btn.textContent = "Working…";
  apiPost(action, data).then(function(r){
    if(r && r.success){
      toast(successMsg, "green");
      if(onSuccess) onSuccess(); else softRefresh();
    } else {

    }
  }).catch(function(e){

    btn.disabled = false; btn.textContent = original;

function renderItemsTable(container, items){
  container.innerHTML = "";
  if(!items.length){
    container.appendChild(el("div", { class:"empty", html:"<h3>No items match</h3><p>Try a different filter or search term.</p>" }));
    return;
  }
  var wrap = el("div", { class:"table-wrap" });
  var tbl = el("table", { class:"tbl" });
  tbl.innerHTML = '<thead><tr><th class="cb-cell"><input type="checkbox" id="selectAllItems"></th><th>Item</th><th class="num">Price</th><th>Source</th><th>Status</th><th class="num">Views</th><th>Submitted</th></tr></thead>';
  var tb = el("tbody");
  items.forEach(function(it){
    var tr = el("tr", { class:"clickable" });
    var cb = el("input", { type:"checkbox" });
    cb.checked = !!state.itemsSelection[it.itemId];
    cb.addEventListener("click", function(e){ e.stopPropagation(); });
    cb.addEventListener("change", function(){
      if(cb.checked) state.itemsSelection[it.itemId] = true;
      else delete state.itemsSelection[it.itemId];
      updateBulkBar();
    });
    var tdCb = el("td", { class:"cb-cell" }); tdCb.appendChild(cb);

    var thumb = it.photo
      ? '<img class="cell-thumb" src="'+esc(it.photo)+'" onerror="imgFail(this)">'
      : '<div class="cell-thumb-fb">📦</div>';
    var src = it.partnerId
      ? '<span class="badge badge-purple">Partner</span>'
      : (it.botSource && /dina/i.test(it.botSource) ? '<span class="badge badge-blue">Dina</span>' : '<span class="badge badge-muted">Seller</span>');
    var stClass = statusKind(it.status);
    tr.innerHTML =
      '<td><div class="cell-item">'+thumb+'<div class="cell-item-body"><div class="cell-item-name">'+esc(it.itemName||"—")+'</div><div class="cell-item-id">'+esc(it.itemId)+(it.partnerId ? ' · '+esc(it.businessName||it.partnerId) : '')+'</div></div></div></td>'+
      '<td class="num strong">'+esc(naira(it.price))+'</td>'+
      '<td>'+src+'</td>'+
      '<td><span class="badge '+stClass+'">'+esc(it.status||"—")+'</span></td>'+
      '<td class="num">'+(it.views||0)+'</td>'+
      '<td class="muted">'+esc(fmtDate(it.submissionTime))+'</td>';
    tr.insertBefore(tdCb, tr.firstChild);
    tr.addEventListener("click", function(){ openItemModal(it); });
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); wrap.appendChild(tbl); container.appendChild(wrap);

  setTimeout(function(){
    var sa = tbl.querySelector("#selectAllItems");
    if(sa) sa.addEventListener("change", function(){
      items.forEach(function(it){
        if(sa.checked) state.itemsSelection[it.itemId] = true;
        else delete state.itemsSelection[it.itemId];
      });
      container.querySelectorAll("tbody input[type=checkbox]").forEach(function(c){ c.checked = sa.checked; });
      updateBulkBar();
    });
  }, 0);
}

      '<td class="num strong">'+esc(naira(p.amountPaid))+'</td>'+
      '<td class="num" style="color:var(--green-dark);font-weight:600;">'+esc(naira(p.amountToSeller))+'</td>'+
      '<td class="muted">'+esc(p.buyerName||p.buyerEmail||"—")+'</td>'+
      '<td><span class="badge '+stClass+'">'+esc(p.status||"—")+'</span></td>'+
      '<td class="muted">'+esc(fmtDate(p.timestamp))+'</td>'+
      '<td>'+(p.hasPin && String(p.status||"").toLowerCase()==="pending pickup" ? '<button class="btn btn-ghost btn-sm" data-resend="'+esc(p.itemId)+'">Resend PIN</button>' : '')+'</td>';
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); tw.appendChild(tbl); card.appendChild(tw);

  tw.querySelectorAll("[data-resend]").forEach(function(b){
    b.addEventListener("click", function(e){
      e.stopPropagation();
      var iid = b.getAttribute("data-resend");
      b.disabled = true; var orig = b.textContent; b.textContent = "Sending…";
      apiPost("adminResendPin", { itemId: iid }).then(function(r2){
        if(r2 && r2.success) toast("PIN re-sent to " + r2.to, "green");
        else toast((r2 && r2.error) || "Failed", "red");
        b.disabled = false; b.textContent = orig;
      });
    });
  });
  return wrap;
}

// ═══════════════════════════════════════════════════════════════
// DINA
// ═══════════════════════════════════════════════════════════════
function renderDina(main){
  main.appendChild(loading());
  Promise.all([
    apiGet("adminDinaLog", { partnerId: state.dinaPartnerFilter || "" }),
    apiGet("adminPartners")
  ]).then(function(results){
    var log = results[0], partners = results[1];
    main.innerHTML = "";
    state.dinaLog = (log && log.success) ? log : { events: [] };
    if(partners && partners.success) state.partners = partners;
    main.appendChild(buildDinaScreen(log, partners));
  }).catch(function(e){
    main.innerHTML = "";
    main.appendChild(el("div", { class:"empty", html:"<h3>Network error</h3><p>"+esc(e.message)+"</p>" }));
  });
}
function buildDinaScreen(logRes, partnersRes){
  var wrap = el("div");
  var events = (logRes && logRes.success && logRes.events) || [];
  var allPartners = (partnersRes && partnersRes.success && partnersRes.partners) || [];
  var dinaPartners = allPartners.filter(function(p){ return String(p.dinaEnabled).toLowerCase() === "yes"; });
  var errs = dinaPartners.filter(function(p){ return String(p.dinaStatus).toLowerCase() === "error"; }).length;
  var awaiting = dinaPartners.filter(function(p){ return String(p.dinaStatus).toLowerCase() === "awaiting_code"; }).length;
  var active = dinaPartners.filter(function(p){ return String(p.dinaStatus).toLowerCase() === "active"; }).length;

  wrap.appendChild(el("div", { class:"head" }, [
    el("div", { class:"head-left" }, [
      el("span", { class:"eyebrow", html:"Automation" }),
      el("h1", { html:"Dina" }),
      el("div", { class:"head-sub", html:dinaPartners.length + " enabled · " + active + " active · " + awaiting + " awaiting bio check · " + errs + " error" })
    ]),
    el("div", { class:"head-actions" }, [
      el("button", { class:"btn btn-primary", onclick: function(e){
        var b = e.currentTarget; b.disabled = true; b.textContent = "Starting…";
        apiPost("adminRunDina", {}).then(function(r){
          if(r && r.success) toast("Dina run started", "green");
          else toast((r && r.error) || "Failed", "red");
          b.disabled = false; b.textContent = "Run Dina now";
        }).catch(function(er){ toast("Network error: " + er.message, "red"); b.disabled = false; b.textContent = "Run Dina now"; });
      }, html:"Run Dina now" })
    ])
  ]));

  // KPIs
  var kpis = el("div", { class:"kpis" });
  function kpi(lbl, val, sub, dark){
    return el("div", { class:"kpi" + (dark ? " dark" : "") }, [
      el("div", { class:"kpi-lbl", html:esc(lbl) }),
      el("div", { class:"kpi-val", html:String(val) }),
      el("div", { class:"kpi-sub", html:esc(sub||"") })
    ]);
  }
  kpis.appendChild(kpi("Partners on Dina", dinaPartners.length, "Enabled = Yes"));
  kpis.appendChild(kpi("Active", active, "IG verified & syncing"));
  kpis.appendChild(kpi("Awaiting bio check", awaiting, "Partner ID not seen yet"));
  kpis.appendChild(kpi("Errors", errs, "Scrape / API failures", true));
  wrap.appendChild(kpis);

  var grid = el("div", { class:"charts", style:"grid-template-columns:1fr;gap:16px;" });
  if(window.innerWidth >= 900) grid.style.gridTemplateColumns = "1fr 1fr";

  // Partners list
  var pc = el("div", { class:"card" });
  pc.appendChild(el("div", { class:"card-head" }, [
    el("div", { class:"card-title", html:"Partners on Dina" }),
    el("span", { class:"badge badge-muted", html:dinaPartners.length + " total" })
  ]));
  if(!dinaPartners.length){
    pc.appendChild(el("div", { class:"empty", html:"<h3>No partners on Dina</h3><p>Enable Dina for a partner to see them here.</p>" }));
  } else {
    var list = el("div", { class:"activity-list", style:"margin-top:12px;margin-left:-22px;margin-right:-22px;margin-bottom:-20px;" });
    dinaPartners.forEach(function(p){
      var dStatus = String(p.dinaStatus||"").toLowerCase();
      var badge = dStatus === "active" ? '<span class="badge badge-green"><span class="badge-dot"></span>active</span>'
        : dStatus === "awaiting_code" ? '<span class="badge badge-amber">awaiting bio check</span>'
        : dStatus === "error" ? '<span class="badge badge-red">error</span>'
        : '<span class="badge badge-muted">'+esc(p.dinaStatus||"—")+'</span>';
      var row = el("div", { class:"activity-row", style:"cursor:pointer;" });
      row.innerHTML =
        '<span class="act-icon '+(dStatus === "error" ? "offer-declined" : dStatus === "awaiting_code" ? "offer-pending" : "offer-accepted")+'">✦</span>'+
        '<div class="act-body"><div class="act-text"><strong>'+esc(p.businessName||p.partnerId)+'</strong> <span style="color:var(--text-muted);font-weight:400;">@'+esc(p.instagram||"—")+'</span></div><div class="act-sub">Last sync '+(p.dinaLastSync ? esc(fmtDate(p.dinaLastSync)) : "never")+' · '+(p.liveItems||0)+' live</div></div>'+
        '<div>'+badge+'</div>';
      row.addEventListener("click", function(){ setRoute("partner", { partnerId: p.partnerId }); });
      list.appendChild(row);
    });
    pc.appendChild(list);
  }
  grid.appendChild(pc);

  // Log
  var lc = el("div", { class:"card" });
  lc.appendChild(el("div", { class:"card-head" }, [
    el("div", { class:"card-title", html:"Recent log" }),
    el("span", { class:"badge badge-muted", html:events.length + " entries" })
  ]));
  if(!events.length){
    lc.appendChild(el("div", { class:"empty", html:"<h3>Nothing logged yet</h3><p>Run Dina and entries will appear here.</p>" }));
  } else {
    var ll = el("div", { style:"margin-top:12px;font-family:var(--font-mono);font-size:12px;" });
    events.slice(0, 40).forEach(function(ev){
      var evt = String(ev.event||"").toUpperCase();
      var col = evt === "LISTED" || evt === "VERIFIED" || evt === "DPS_SOLD" ? "var(--green-dark)"
        : evt === "UPDATED" ? "var(--blue)"
        : evt === "UNAVAILABLE" ? "var(--amber)"
        : evt === "ERROR" ? "var(--red)"
        : "var(--text-muted)";
      var row = el("div", { style:"padding:10px 0;border-bottom:1px solid var(--border);" });
      row.innerHTML =
        '<div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:4px;">'+
          '<span style="font-weight:600;color:'+col+';">'+esc(evt)+'</span>'+
          '<span style="color:var(--text-muted);font-size:10.5px;">'+esc(fmtDateFull(ev.loggedAt))+'</span>'+
        '</div>'+
        '<div style="color:var(--text-secondary);font-family:var(--font-body);font-size:12.5px;line-height:1.5;">'+
          (ev.partnerId ? '<strong style="font-family:var(--font-mono);color:var(--ink);">'+esc(ev.partnerId)+'</strong>'+(ev.itemId ? ' · ' : '') : '')+
          (ev.itemId ? '<span style="font-family:var(--font-mono);color:var(--ink);">'+esc(ev.itemId)+'</span> · ' : '')+
          esc(ev.reason||"—")+
        '</div>';
      ll.appendChild(row);
    });
    lc.appendChild(ll);
  }
  grid.appendChild(lc);

  wrap.appendChild(grid);
  return wrap;
}

// ═══════════════════════════════════════════════════════════════
// MODALS
// ═══════════════════════════════════════════════════════════════
function openModal(o, buttons){
  var modal = $("modal"); modal.innerHTML = "";
  var head = el("div", { class:"modal-head" });
  head.innerHTML = '<div class="modal-title">'+o.title+'</div>';
  var close = el("button", { class:"modal-close", html:"✕" });
  close.addEventListener("click", closeModal);
  head.appendChild(close);
  modal.appendChild(head);
  var body = el("div", { class:"modal-body" });
  if(typeof o.body === "string") body.innerHTML = o.body;
  else if(o.body) body.appendChild(o.body);
  modal.appendChild(body);
  if(buttons && buttons.length){
    var foot = el("div", { class:"modal-foot" });
    buttons.forEach(function(b){
      var btn = el("button", { class:"btn " + (b.class||"btn-ghost"), html:b.label });
      btn.addEventListener("click", function(){ b.onClick(btn); });
      foot.appendChild(btn);
    });
    modal.appendChild(foot);
  }
  $("modalBg").classList.add("open");
}
function closeModal(){ $("modalBg").classList.remove("open"); }
$("modalBg").addEventListener("click", function(e){ if(e.target === $("modalBg")) closeModal(); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeModal(); });

function openItemModal(it){
  var body = el("div");
  var photo = it.photo ? '<img src="'+esc(it.photo)+'" style="width:100%;border-radius:12px;margin-bottom:16px;" onerror="this.remove()">' : '';
  var stClass = statusKind(it.status);
  var srcBadge = it.partnerId ? '<span class="badge badge-purple">Partner: '+esc(it.businessName||it.partnerId)+'</span>' : '<span class="badge badge-muted">Seller</span>';
  body.innerHTML =
    photo +
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;">'+
      '<span class="badge '+stClass+'">'+esc(it.status||"—")+'</span>'+srcBadge+
      (it.statusReason ? '<span class="badge badge-muted">'+esc(it.statusReason)+'</span>' : '')+
    '</div>'+
    '<div class="kv-list">'+
      '<div class="kv-row"><span class="kv-k">Item ID</span><span class="kv-v mono">'+esc(it.itemId)+'</span></div>'+
      '<div class="kv-row"><span class="kv-k">Name</span><span class="kv-v">'+esc(it.itemName||"—")+'</span></div>'+
      '<div class="kv-row"><span class="kv-k">Price</span><span class="kv-v">'+esc(naira(it.price))+'</span></div>'+
      '<div class="kv-row"><span class="kv-k">Condition</span><span class="kv-v">'+esc(it.condition||"—")+'</span></div>'+
      '<div class="kv-row"><span class="kv-k">Location</span><span class="kv-v">'+esc(it.location||"—")+'</span></div>'+
      '<div class="kv-row"><span class="kv-k">Views</span><span class="kv-v">'+(it.views||0)+'</span></div>'+
      '<div class="kv-row"><span class="kv-k">Submitted</span><span class="kv-v">'+esc(fmtDateFull(it.submissionTime))+'</span></div>'+
    '</div>';

  var btns = [];
  var st = String(it.status||"").toLowerCase();
  if(st === "pending approval" || st === "draft"){
    btns.push({ label:"Approve", class:"btn-primary", onClick:function(b){
      b.disabled = true; b.textContent = "Approving…";
      apiPost("adminApproveItem", { itemId: it.itemId }).then(function(r){
        if(r && r.success){ toast("Item approved · " + it.itemId, "green"); closeModal(); softRefresh(); }
        else { toast((r && r.error) || "Failed", "red"); b.disabled = false; b.textContent = "Approve"; }
      });
    }});
    btns.push({ label:"Reject", class:"btn-danger-solid", onClick:function(){
      promptReason("Reject item", "Reason (sent to seller)", function(reason){
        apiPost("adminRejectItem", { itemId: it.itemId, reason: reason }).then(function(r){
          if(r && r.success){ toast("Item rejected", "amber"); closeModal(); softRefresh(); }
          else toast((r && r.error) || "Failed", "red");
        });
      });
    }});
  } else if(st === "active"){
    btns.push({ label:"Remove", class:"btn-danger-solid", onClick:function(){
      promptReason("Remove item", "Reason (internal only)", function(reason){
        apiPost("adminRemoveItem", { itemId: it.itemId, reason: reason }).then(function(r){
          if(r && r.success){ toast("Item removed", "amber"); closeModal(); softRefresh(); }
          else toast((r && r.error) || "Failed", "red");
        });
      });
    }});
  }
  btns.push({ label:"Close", class:"btn-ghost", onClick:closeModal });
  openModal({ title: esc(it.itemName||"Item"), body: body }, btns);
}

function promptReason(title, placeholder, onConfirm){
  var body = el("div");
  body.innerHTML = '<div class="field"><label>Reason</label><textarea id="reasonInput" placeholder="'+esc(placeholder)+'"></textarea></div>';
  openModal({ title: esc(title), body: body }, [
    { label:"Cancel", class:"btn-ghost", onClick:closeModal },
    { label:"Confirm", class:"btn-primary", onClick:function(){
      var v = ($("reasonInput") ? $("reasonInput").value.trim() : "");
      closeModal(); onConfirm(v);
    }}
  ]);
}

function openEmailComposer(p){
  var body = el("div");
  var to = p.email || p.repEmail || "";
  body.innerHTML =
    '<div class="field"><label>To</label><input type="text" value="'+esc(to)+'" disabled></div>'+
    '<div class="field"><label>Subject</label><input type="text" id="emailSubject" placeholder="Subject"></div>'+
    '<div class="field"><label>Message</label><textarea id="emailBody" placeholder="Write your message…" style="min-height:180px;"></textarea></div>';
  openModal({ title:"Email partner · "+esc(p.businessName), body: body }, [
    { label:"Cancel", class:"btn-ghost", onClick:closeModal },
    { label:"Send", class:"btn-primary", onClick:function(btn){
      var subj = $("emailSubject").value.trim();
      var msg = $("emailBody").value.trim();
      if(!subj || !msg){ toast("Subject and message required", "red"); return; }
      btn.disabled = true; btn.textContent = "Sending…";
      apiPost("adminEmailPartner", { partnerId: p.partnerId, subject: subj, body: msg }).then(function(r){
        if(r && r.success){ toast("Email sent to " + to, "green"); closeModal(); }
        else { toast((r && r.error) || "Failed to send", "red"); btn.disabled = false; btn.textContent = "Send"; }
      });
    }}
  ]);
}

// ═══════════════════════════════════════════════════════════════
// BULK ACTIONS
// ═══════════════════════════════════════════════════════════════
function updateBulkBar(){
  var ids = Object.keys(state.itemsSelection || {});
  var bar = $("bulkBar");
  if(!ids.length || state.route !== "items"){ bar.classList.remove("on"); return; }
  bar.classList.add("on");
  $("bulkCount").textContent = ids.length + " selected";
}
function runBulk(action, reason){
  var ids = Object.keys(state.itemsSelection || {});
  if(!ids.length) return;
  $("bulkApprove").disabled = true;
  apiPost("adminBulkItems", { itemIds: ids, bulkAction: action, reason: reason }).then(function(r){
    $("bulkApprove").disabled = false;
    if(r && r.success){
      toast(r.ok + " " + action + "d" + (r.fail ? " · " + r.fail + " failed" : ""), r.fail ? "amber" : "green");
      state.itemsSelection = {}; updateBulkBar(); softRefresh();
    } else {
      toast((r && r.error) || "Failed", "red");
    }
  });
}
$("bulkClear").addEventListener("click", function(){ state.itemsSelection = {}; updateBulkBar(); render(); });
$("bulkApprove").addEventListener("click", function(){ runBulk("approve", ""); });
$("bulkReject").addEventListener("click", function(){
  var n = Object.keys(state.itemsSelection || {}).length;
  if(!n) return;
  promptReason("Reject " + n + " items", "Reason (sent to every seller)", function(reason){ runBulk("reject", reason); });
});

// ═══════════════════════════════════════════════════════════════
// REFRESH
// ═══════════════════════════════════════════════════════════════
function softRefresh(){
  if(state.refreshing) return;
  state.refreshing = true;
  state.today = state.partners = state.partnerDetail = state.items = state.sales = state.offers = state.payouts = state.dinaLog = null;
  apiGet("adminDashboard").then(function(r){
    if(r && r.success) state.today = r;
    state.refreshing = false;
    route_();
  }).catch(function(){
    state.refreshing = false;
    route_();
  });
}
$("btnRefresh").addEventListener("click", function(){
  var svg = this.querySelector("svg");
  svg.style.transition = "transform .6s";
  svg.style.transform = "rotate(360deg)";
  setTimeout(function(){ svg.style.transition = ""; svg.style.transform = ""; }, 620);
  softRefresh();
});

// ═══════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════
if(state.key){
  validateKey(state.key).then(function(ok){ if(!ok) showAuth(); });
} else {
  showAuth();
}

})();
</script>
